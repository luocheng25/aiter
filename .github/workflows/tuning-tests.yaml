name: Tuning Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "aiter/ops/flydsl/**"
      - "aiter/aot/flydsl/**"
      - "aiter/fused_moe.py"
      - "aiter/fused_moe_registry.py"
      - "aiter/configs/**"
      - "csrc/ck_gemm_moe_2stages_codegen/gemm_moe_tune.py"
      - "op_tests/tuning_tests/**"
      - ".github/workflows/tuning-tests.yaml"
      - ".github/workflows/ci-config.yaml"
      - ".github/scripts/build_aiter_triton.sh"
      - "requirements*.txt"
      - "pyproject.toml"
      - "setup.py"
  schedule:
    # Runs daily at 04:00 Beijing time.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Select the README test command to run
        required: true
        type: choice
        default: all
        options:
          - all
          - level01
          - tune_pipeline
          - run_config
          - run_only

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GPU_ARCHS: gfx950
  REPORT_DIR: tuning_test_reports
  LOG_DIR: .github/test-logs/tuning-tests

jobs:
  ci_config:
    uses: ./.github/workflows/ci-config.yaml

  cpu-validation:
    # Persistent GPU hosts only execute trusted same-repository PR branches.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.suite == 'all' || github.event.inputs.suite == 'level01'))
    name: README Level 0+1
    runs-on: linux-aiter-mi35x-1
    timeout-minutes: 45
    needs: ci_config
    env:
      DOCKER_IMAGE: ${{ needs.ci_config.outputs.pytorch_py312_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync CK submodule
        run: |
          set -ex
          git submodule sync
          git submodule update --init --recursive --depth 1 --jobs 4

      - name: Clean up ROCm processes
        run: ./.github/scripts/clean_up_rocm.sh

      - name: Start container
        run: |
          set -ex
          mkdir -p "${LOG_DIR}" "${REPORT_DIR}"

          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi

          docker run -dt \
            --device=/dev/kfd $DEVICE_FLAG \
            --shm-size=16G \
            --network=host \
            --group-add $(getent group render | cut -d: -f3) \
            --group-add $(getent group video | cut -d: -f3) \
            -e GPU_ARCHS="${GPU_ARCHS}" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/$REPORT_DIR:/tmp/tuning_test_reports" \
            -w /workspace \
            --name tuning_tests_level01 \
            $DOCKER_IMAGE

      - name: Setup Aiter
        run: |
          set -ex
          docker exec \
            -e GPU_ARCHS="${GPU_ARCHS}" \
            -w /workspace \
            tuning_tests_level01 \
            bash -lc "BUILD_TRITON=0 ./.github/scripts/build_aiter_triton.sh"

      - name: Run README level 0+1 suite
        run: |
          set -ex
          docker exec \
            -e GPU_ARCHS="${GPU_ARCHS}" \
            -e PYTHONUNBUFFERED=1 \
            -w /workspace \
            tuning_tests_level01 \
            bash -lc "set -euo pipefail; python3 -m unittest op_tests.tuning_tests.test_csv_validation op_tests.tuning_tests.test_tuner_infra op_tests.tuning_tests.test_mp_tuner_logic op_tests.tuning_tests.test_a6w6_tuning op_tests.tuning_tests.test_config_shape_collision op_tests.tuning_tests.test_online_tune op_tests.tuning_tests.test_flydsl_gfx942_mxfp4 op_tests.tuning_tests.test_fmoe_e2e_review op_tests.tuning_tests.test_tune_pipeline.TestFlydslGfx942MoeConfig -v 2>&1 | tee /workspace/${LOG_DIR}/level01.log"

      - name: Upload level 0+1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuning-tests-level01-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ env.LOG_DIR }}/level01.log
            ${{ env.REPORT_DIR }}/

      - name: Cleanup container
        if: always()
        run: docker rm -f tuning_tests_level01 || true

      - name: Clean up ROCm processes
        if: always()
        run: ./.github/scripts/clean_up_rocm.sh

  gpu-pipeline:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'tune_pipeline' }}
    name: README Level 2 Pipeline
    runs-on: linux-aiter-mi35x-1
    timeout-minutes: 75
    needs: ci_config
    env:
      DOCKER_IMAGE: ${{ needs.ci_config.outputs.pytorch_py312_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync CK submodule
        run: |
          set -ex
          git submodule sync
          git submodule update --init --recursive --depth 1 --jobs 4

      - name: Clean up ROCm processes
        run: ./.github/scripts/clean_up_rocm.sh

      - name: Start container
        run: |
          set -ex
          mkdir -p "${LOG_DIR}" "${REPORT_DIR}"

          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi

          docker run -dt \
            --device=/dev/kfd $DEVICE_FLAG \
            --shm-size=16G \
            --network=host \
            --group-add $(getent group render | cut -d: -f3) \
            --group-add $(getent group video | cut -d: -f3) \
            -e GPU_ARCHS="${GPU_ARCHS}" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/$REPORT_DIR:/tmp/tuning_test_reports" \
            -w /workspace \
            --name tuning_tests_pipeline \
            $DOCKER_IMAGE

      - name: Setup Aiter
        run: |
          set -ex
          docker exec \
            -e GPU_ARCHS="${GPU_ARCHS}" \
            -w /workspace \
            tuning_tests_pipeline \
            bash -lc "BUILD_TRITON=0 ./.github/scripts/build_aiter_triton.sh"

      - name: Run README tune pipeline suite
        run: |
          set -ex
          docker exec \
            -e GPU_ARCHS="${GPU_ARCHS}" \
            -e PYTHONUNBUFFERED=1 \
            -w /workspace \
            tuning_tests_pipeline \
            bash -lc "set -euo pipefail; python3 -m unittest op_tests.tuning_tests.test_tune_pipeline -v 2>&1 | tee /workspace/${LOG_DIR}/tune-pipeline.log"

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuning-tests-tune-pipeline-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ env.LOG_DIR }}/tune-pipeline.log
            ${{ env.REPORT_DIR }}/

      - name: Cleanup container
        if: always()
        run: docker rm -f tuning_tests_pipeline || true

      - name: Clean up ROCm processes
        if: always()
        run: ./.github/scripts/clean_up_rocm.sh

  gpu-run-only:
    # Forks retain GitHub-hosted checks; do not expose them to persistent GPU hosts.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.suite == 'all' || github.event.inputs.suite == 'tune_pipeline' ||
        github.event.inputs.suite == 'run_only'))
    name: Whole-graph MoE AOT run-only (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: gfx942
            runner: linux-aiter-oci-mi300x-1
          - arch: gfx950
            runner: linux-aiter-mi35x-1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: ci_config
    env:
      GPU_ARCHS: ${{ matrix.arch }}
      DOCKER_IMAGE: ${{ needs.ci_config.outputs.pytorch_py312_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run cold-cache MoE AOT regressions
        run: |
          set -euo pipefail
          mkdir -p "${LOG_DIR}"
          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi
          docker run --rm \
            --device=/dev/kfd $DEVICE_FLAG \
            --shm-size=16G \
            --network=host \
            --group-add $(getent group render | cut -d: -f3) \
            --group-add $(getent group video | cut -d: -f3) \
            -e GPU_ARCHS="${GPU_ARCHS}" \
            -e PYTHONUNBUFFERED=1 \
            -e AITER_ONLINE_TUNE=0 \
            -e AITER_TEST_EXPECTED_GFX="${GPU_ARCHS}" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "$DOCKER_IMAGE" \
            bash -lc 'set -euo pipefail; BUILD_TRITON=0 ./.github/scripts/build_aiter_triton.sh; python3 -m unittest op_tests.tuning_tests.test_flydsl_gfx942_run_only -v' \
            2>&1 | tee "${LOG_DIR}/moe-run-only-${{ matrix.arch }}.log"

      - name: Upload MoE run-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuning-tests-moe-run-only-${{ matrix.arch }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: ${{ env.LOG_DIR }}/moe-run-only-${{ matrix.arch }}.log

  gpu-run-config:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'run_config' }}
    name: README Level 2 Run Config
    runs-on: linux-aiter-mi35x-1
    timeout-minutes: 120
    needs: ci_config
    env:
      DOCKER_IMAGE: ${{ needs.ci_config.outputs.pytorch_py312_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync CK submodule
        run: |
          set -ex
          git submodule sync
          git submodule update --init --recursive --depth 1 --jobs 4

      - name: Clean up ROCm processes
        run: ./.github/scripts/clean_up_rocm.sh

      - name: Start container
        run: |
          set -ex
          mkdir -p "${LOG_DIR}" "${REPORT_DIR}"

          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi

          docker run -dt \
            --device=/dev/kfd $DEVICE_FLAG \
            --shm-size=16G \
            --network=host \
            --group-add $(getent group render | cut -d: -f3) \
            --group-add $(getent group video | cut -d: -f3) \
            -e GPU_ARCHS="${GPU_ARCHS}" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/$REPORT_DIR:/tmp/tuning_test_reports" \
            -w /workspace \
            --name tuning_tests_run_config \
            $DOCKER_IMAGE

      - name: Setup Aiter
        run: |
          set -ex
          docker exec \
            -e GPU_ARCHS="${GPU_ARCHS}" \
            -w /workspace \
            tuning_tests_run_config \
            bash -lc "BUILD_TRITON=0 ./.github/scripts/build_aiter_triton.sh"

      - name: Run README run_config suite
        run: |
          set -ex
          docker exec \
            -e GPU_ARCHS="${GPU_ARCHS}" \
            -e PYTHONUNBUFFERED=1 \
            -w /workspace \
            tuning_tests_run_config \
            bash -lc "set -euo pipefail; python3 -m unittest op_tests.tuning_tests.test_run_config -v 2>&1 | tee /workspace/${LOG_DIR}/run-config.log"

      - name: Upload run_config artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuning-tests-run-config-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ env.LOG_DIR }}/run-config.log
            ${{ env.REPORT_DIR }}/

      - name: Cleanup container
        if: always()
        run: docker rm -f tuning_tests_run_config || true

      - name: Clean up ROCm processes
        if: always()
        run: ./.github/scripts/clean_up_rocm.sh
